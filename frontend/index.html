<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>꼬미입시 (울산 고입전형 모의지원 및 진학상담)</title>
</head>
<body>
<!-- 배경 효과 -->
<div class="bg-glow" style="width:400px;height:400px;background:#6366f1;top:-100px;left:-100px;"></div>
<div class="bg-glow" style="width:300px;height:300px;background:#8b5cf6;bottom:-80px;right:-80px;"></div>

<!-- 공통 틀(로그인 뒤 화면에서만 보임): core/appShell.js -->
<header id="shellTop" class="no-print" hidden></header>
<nav id="shellNav" class="no-print" aria-label="주 메뉴" hidden></nav>

<div id="app"></div>

<!-- 왼쪽 하단 전역 피드백 플로팅 버튼 (모든 페이지 공통 노출) -->
<div id="globalFeedbackContainer" class="fixed bottom-3.5 left-4 z-40 no-print">
    <button id="globalFeedbackFloatingBtn" 
            type="button"
            class="group px-3.5 py-1.5 rounded-full bg-slate-900/90 hover:bg-slate-800 text-emerald-300 hover:text-emerald-200 border border-emerald-500/50 hover:border-emerald-400 shadow-xl backdrop-blur-md font-bold text-xs flex items-center gap-1.5 transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer" 
            title="질문·피드백 남기기 (GitHub 이슈, 공개 게시판이므로 학생 정보는 쓰지 마세요)">
        <span class="text-sm group-hover:scale-125 transition-transform">💬</span>
        <span class="tracking-wide">질문·피드백</span>
    </button>
</div>

<!-- 보안 워터마크 -->
<div class="watermark">
    🔒 학생 자료 외부 전송 없음 · Made by 푸른파도소리
</div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
